<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#C9A84C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VI Health" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96.png" />

    <!-- SEO / OG -->
    <title>VI Vita Intelligence — Ayurvedic Men's Health</title>
    <meta name="description" content="India's AI-powered men's Ayurvedic wellness. Personalised health stack for testosterone, energy, performance & stress." />
    <meta name="keywords" content="ayurvedic supplement, men health, testosterone booster, shilajit, ashwagandha, India" />

    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://vitaintelligence.in/" />
    <meta property="og:title"       content="VI Vita Intelligence" />
    <meta property="og:description" content="Your personalised Ayurvedic health stack. Built by AI. Proven by Ayurveda." />
    <meta property="og:image"       content="https://vitaintelligence.in/og-image.jpg" />

    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="VI Vita Intelligence" />
    <meta name="twitter:description" content="Your personalised Ayurvedic health stack." />
    <meta name="twitter:image"       content="https://vitaintelligence.in/og-image.jpg" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://firebaseapp.com" />

    <!-- Razorpay (must be in head) -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>

    <!-- Prevent flash of unstyled content -->
    <style>
      body { margin: 0; background: #D6CCB8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('VI SW registered:', reg.scope),
            (err) => console.log('VI SW registration failed:', err)
          )
        })
      }
    </script>
  </body>
</html>
