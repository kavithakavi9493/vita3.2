version: "3.9"

# ─────────────────────────────────────────────────────────────────
# VI Vita Intelligence — Full Stack Docker Compose
# ─────────────────────────────────────────────────────────────────
# Usage:
#   cp backend/.env.example backend/.env        (fill in real values)
#   docker-compose up --build
#
# Services:
#   backend   → http://localhost:8080
#   frontend  → http://localhost:5173
#   redis     → localhost:6379  (caching)
#   firebase  → localhost:8090  (Firestore emulator — dev only)
# ─────────────────────────────────────────────────────────────────

services:

  # ── FastAPI Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vi-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ENV=dev
      - PORT=8080
      - REDIS_URL=redis://redis:6379/0
      - FIRESTORE_EMULATOR_HOST=firebase:8080
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./backend/serviceAccountKey.json:/app/serviceAccountKey.json:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload

  # ── React Frontend ───────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: vi-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - vi-network
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  # ── WhatsApp Queue Worker ────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vi-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - ENV=dev
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./backend/serviceAccountKey.json:/app/serviceAccountKey.json:ro
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - vi-network
    # Runs every 5 minutes via a simple loop
    command: sh -c "while true; do python -m worker.whatsapp_sender --once; sleep 300; done"

  # ── Redis Cache ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - vi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ── Firebase Emulator (dev only) ─────────────────────────────
  firebase:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    container_name: vi-firebase-emulator
    working_dir: /app
    ports:
      - "4000:4000"  # Emulator UI
      - "8090:8080"  # Firestore
      - "9099:9099"  # Auth
    volumes:
      - ./frontend:/app
    networks:
      - vi-network
    command: >
      bash -c "npm install -g firebase-tools &&
               firebase emulators:start --only firestore,auth --project vi-dev"
    profiles:
      - dev   # Only starts with: docker-compose --profile dev up

networks:
  vi-network:
    driver: bridge

volumes:
  redis-data:
